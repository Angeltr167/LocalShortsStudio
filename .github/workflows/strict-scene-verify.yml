name: Verify Strict Scene Matching

on:
  push:
    branches:
      - feature/strict-scene-matching

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/strict-scene-matching
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Normalize config marker for patch
        shell: python
        run: |
          from pathlib import Path
          path = Path("config.example.toml")
          text = path.read_text(encoding="utf-8")
          old = (
              '# API key lists support key rotation. Use straight ASCII double quotes and\n'
              '# separate multiple keys with commas, for example: ["key-1", "key-2"].\n'
          )
          if text.count(old) != 1:
              raise RuntimeError("unexpected config API-key header")
          path.write_text(
              text.replace(old, '# API key lists support key rotation.\n', 1),
              encoding="utf-8",
          )

      - name: Apply deterministic patch
        run: |
          python .github/scripts/apply_strict_scene_patch.py
          python .github/scripts/apply_strict_scene_safety_patch.py
          python .github/scripts/add_strict_scene_i18n.py

      - name: Restore config documentation
        shell: python
        run: |
          from pathlib import Path
          path = Path("config.example.toml")
          text = path.read_text(encoding="utf-8")
          marker = '# API key lists support key rotation.\n'
          replacement = (
              '# API key lists support key rotation. Use straight ASCII double quotes and\n'
              '# separate multiple keys with commas, for example: ["key-1", "key-2"].\n'
          )
          if text.count(marker) != 1:
              raise RuntimeError("strict scene patch did not preserve config marker")
          path.write_text(text.replace(marker, replacement, 1), encoding="utf-8")

      - name: Inspect patch integrity
        run: |
          git diff --check
          git diff --stat

      - name: Install locked dependencies
        run: uv sync --frozen --python 3.11

      - name: Compile changed Python sources
        run: >-
          uv run --no-sync python -m compileall
          app/models/schema.py
          app/services/material.py
          app/services/strict_scene.py
          app/services/task.py
          webui/Main.py
          test/services/test_strict_scene_matching.py

      - name: Ruff changed Python sources
        run: >-
          uv run --no-sync ruff check
          app/models/schema.py
          app/services/material.py
          app/services/strict_scene.py
          app/services/task.py
          webui/Main.py
          test/services/test_strict_scene_matching.py

      - name: Run focused regression tests
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          test/services/test_strict_scene_matching.py
          test/services/test_material.py
          test/services/test_task.py
          test/services/test_schema.py
          test/services/test_webui_i18n.py

      - name: Run full test suite
        run: uv run --no-sync python -X utf8 -m pytest -q test

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/models/schema.py app/services/material.py app/services/task.py \
            webui/Main.py webui/i18n/*.json config.example.toml
          git diff --cached --check
          git commit -m "feat: add opt-in strict scene matching"
          git push origin feature/strict-scene-matching
