name: Verify AI Cartoon Visual Polish

on:
  push:
    branches:
      - feature/ai-cartoon-engine
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-cartoon-visual-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Apply AI cartoon visual polish patch
        run: python .github/scripts/apply_ai_cartoon_visual_polish_patch.py

      - name: Inspect patch integrity
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path

          checks = {
              "app/services/cartoon_engine.py": (
                  "def _heuristic_audio_mouth_cues",
                  "def _compact_overlay",
                  "identity_host = color == self.palette.host",
                  'elif action == "react":',
              ),
              "webui/Main.py": (
                  '"ai_cartoon",',
                  'key="video_concat_mode_cartoon_locked"',
                  "AI Cartoon uses one authored narration timeline in sequential order.",
              ),
              "test/services/test_cartoon_engine.py": (
                  "test_audio_aware_heuristic_mouth_closes_between_cues",
                  "test_non_graphic_semantic_overlay_renders_real_visual_card",
              ),
              "test/services/test_cartoon_webui_contract.py": (
                  "test_ai_cartoon_is_accepted_by_generation_validation",
                  "test_ai_cartoon_concat_widget_is_visibly_locked_to_sequential",
              ),
          }
          for path, needles in checks.items():
              text = Path(path).read_text(encoding="utf-8")
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(
                          f"missing expected visual-polish marker {needle!r} in {path}"
                      )
          print("AI cartoon visual-polish markers verified")
          PY
          git diff -- app/services/cartoon_engine.py webui/Main.py test/services/test_cartoon_engine.py test/services/test_cartoon_webui_contract.py

      - name: Install locked dependencies
        run: uv sync --frozen --python 3.11

      - name: Compile changed sources
        run: >-
          uv run --no-sync python -m compileall -q
          app/services/cartoon_engine.py
          webui/Main.py
          test/services/test_cartoon_engine.py
          test/services/test_cartoon_webui_contract.py

      - name: Ruff changed sources
        run: >-
          uv run --no-sync ruff check
          app/services/cartoon_engine.py
          webui/Main.py
          test/services/test_cartoon_engine.py
          test/services/test_cartoon_webui_contract.py

      - name: Run focused cartoon tests
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          test/services/test_cartoon_engine.py
          test/services/test_cartoon_webui_contract.py
          test/services/test_cartoon_final_pipeline.py
          test/services/test_cartoon_render_smoke.py
          test/services/test_cartoon_ollama_director.py
          test/services/test_task.py
          test/services/test_llm.py

      - name: Run full test suite
        run: uv run --no-sync python -X utf8 -m pytest -q test

      - name: Commit verified AI cartoon visual polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/services/cartoon_engine.py \
            webui/Main.py \
            test/services/test_cartoon_engine.py \
            test/services/test_cartoon_webui_contract.py
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "feat: polish AI cartoon visual storytelling"
          git push origin HEAD:feature/ai-cartoon-engine
