name: Verify Manual GPT Visual Review

on:
  push:
    branches:
      - feature/manual-gpt-visual-review
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Apply manual GPT visual review patch
        run: python .github/scripts/apply_manual_gpt_visual_review_patch.py

      - name: Inspect patch integrity
        run: |
          git diff --check
          grep -q "extra_negative_queries" app/services/semantic_ranker.py
          grep -q "record_scene_candidates" app/services/strict_scene.py
          grep -q "GPT Visual Review" webui/Main.py
          grep -q "def export_review_package" app/services/gpt_visual_review.py
          grep -q "def apply_decisions" app/services/gpt_visual_review.py
          git diff -- app/services/gpt_visual_review.py app/services/strict_scene.py app/services/semantic_ranker.py webui/Main.py webui/pages/GPT_Visual_Review.py

      - name: Install locked dependencies
        run: uv sync --frozen --python 3.11

      - name: Compile changed sources
        run: >-
          uv run --no-sync python -m compileall -q
          app/services/gpt_visual_review.py
          app/services/strict_scene.py
          app/services/semantic_ranker.py
          webui/pages/GPT_Visual_Review.py
          webui/Main.py
          test/services/test_gpt_visual_review.py

      - name: Ruff changed sources
        run: >-
          uv run --no-sync ruff check
          app/services/gpt_visual_review.py
          app/services/strict_scene.py
          app/services/semantic_ranker.py
          webui/pages/GPT_Visual_Review.py
          webui/Main.py
          test/services/test_gpt_visual_review.py

      - name: Run focused regression tests
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          test/services/test_gpt_visual_review.py
          test/services/test_semantic_scene_ranking.py
          test/services/test_strict_scene_matching.py
          test/services/test_material.py
          test/services/test_task.py

      - name: Run full test suite
        run: uv run --no-sync python -X utf8 -m pytest -q test

      - name: Commit verified manual GPT visual review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/services/gpt_visual_review.py \
            app/services/strict_scene.py \
            app/services/semantic_ranker.py \
            webui/Main.py \
            webui/pages/GPT_Visual_Review.py \
            test/services/test_gpt_visual_review.py
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "feat: add manual GPT visual review workflow"
          git push origin HEAD:feature/manual-gpt-visual-review
