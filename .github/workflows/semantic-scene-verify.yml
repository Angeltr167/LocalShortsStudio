name: Verify Semantic Scene Ranking

on:
  push:
    branches:
      - feature/semantic-scene-ranking

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out semantic feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/semantic-scene-ranking
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Apply deterministic semantic patch
        run: |
          python .github/scripts/apply_semantic_scene_patch.py
          python .github/scripts/add_semantic_scene_i18n.py

      - name: Inspect patch integrity
        run: |
          git diff --check
          git diff --stat

      - name: Install locked main-app dependencies
        run: uv sync --frozen --python 3.11

      - name: Compile changed Python sources
        run: >-
          uv run --no-sync python -m compileall
          app/models/schema.py
          app/services/material.py
          app/services/semantic_ranker.py
          app/services/strict_scene.py
          app/services/task.py
          semantic_ranker/main.py
          webui/Main.py
          test/services/test_semantic_scene_ranking.py

      - name: Ruff changed Python sources
        run: >-
          uv run --no-sync ruff check
          app/models/schema.py
          app/services/material.py
          app/services/semantic_ranker.py
          app/services/strict_scene.py
          app/services/task.py
          semantic_ranker/main.py
          webui/Main.py
          test/services/test_semantic_scene_ranking.py

      - name: Run focused regression tests
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          test/services/test_semantic_scene_ranking.py
          test/services/test_strict_scene_matching.py
          test/services/test_material.py
          test/services/test_task.py
          test/services/test_schema.py
          test/services/test_webui_i18n.py

      - name: Run full test suite
        run: uv run --no-sync python -X utf8 -m pytest -q test

      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/models/schema.py app/services/material.py app/services/strict_scene.py \
            app/services/task.py webui/Main.py webui/i18n/*.json config.example.toml
          git diff --cached --check
          git commit -m "feat: integrate semantic scene ranking"
          git push origin feature/semantic-scene-ranking
