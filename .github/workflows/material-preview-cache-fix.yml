name: Fix Material Preview Cache

on:
  push:
    branches:
      - feature/semantic-negative-diversity
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/semantic-negative-diversity
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Apply material preview cache fix
        run: python .github/scripts/apply_material_preview_cache_fix.py

      - name: Inspect patch integrity
        run: |
          git diff --check
          git diff --stat

      - name: Install locked dependencies
        run: uv sync --frozen --python 3.11

      - name: Compile changed sources
        run: >-
          uv run --no-sync python -m compileall
          app/services/material_cache.py
          test/services/test_material_cache.py

      - name: Ruff changed sources
        run: >-
          uv run --no-sync ruff check
          app/services/material_cache.py
          test/services/test_material_cache.py

      - name: Run focused regression tests
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          test/services/test_material_cache.py
          test/services/test_semantic_scene_ranking.py
          test/services/test_strict_scene_matching.py
          test/services/test_material.py

      - name: Run full test suite
        run: uv run --no-sync python -X utf8 -m pytest -q test

      - name: Commit verified cache fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/material_cache.py test/services/test_material_cache.py
          git diff --cached --check
          git commit -m "fix: preserve semantic preview images in material cache"
          git push origin feature/semantic-negative-diversity
