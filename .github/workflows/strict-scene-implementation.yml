name: Strict Scene Matching Implementation

on:
  push:
    branches:
      - feature/strict-scene-matching

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/strict-scene-matching
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Apply strict scene matching patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"expected exactly one match in {path}, found {count}: {old[:120]!r}"
                  )
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "app/models/schema.py",
              "    match_materials_to_script: bool = False\n    video_count: int = Field(default=1, ge=1)\n",
              "    match_materials_to_script: bool = False\n"
              "    # Opt-in stock-footage mode that assigns one ordered query to each\n"
              "    # timeline scene. Disabled by default to preserve upstream behavior.\n"
              "    strict_scene_matching: bool = False\n"
              "    video_count: int = Field(default=1, ge=1)\n",
          )

          replace_once(
              "app/services/material.py",
              "    max_clip_duration: int = 5,\n    match_script_order: bool = False,\n) -> List[str]:\n",
              "    max_clip_duration: int = 5,\n"
              "    match_script_order: bool = False,\n"
              "    strict_scene_matching: bool = False,\n"
              ") -> List[str]:\n",
          )

          strict_helpers = r'''
          def _normalize_scene_search_terms(search_terms: List[str]) -> list[str]:
              """Return non-empty stock-footage queries while preserving user order."""
              return [
                  str(term).strip()
                  for term in search_terms
                  if str(term or "").strip()
              ]


          def _build_strict_scene_plan(
              search_terms: List[str],
              audio_duration: float,
              max_clip_duration: int,
          ) -> list[dict[str, Any]]:
              """Build deterministic scene slots from real narration duration.

              Ordered search terms are treated as scene intents. When there are fewer
              queries than clip-sized timeline slots, a query is repeated only across
              adjacent slots. This preserves narrative order instead of cycling back to
              an earlier topic later in the video.
              """
              terms = _normalize_scene_search_terms(search_terms)
              if not terms:
                  return []

              try:
                  required_duration = float(audio_duration)
              except (TypeError, ValueError, OverflowError):
                  return []
              if not math.isfinite(required_duration) or required_duration <= 0:
                  return []

              try:
                  clip_duration = int(max_clip_duration)
              except (TypeError, ValueError, OverflowError):
                  return []
              if clip_duration <= 0:
                  return []

              scene_count = max(1, math.ceil(required_duration / clip_duration))
              scene_plan: list[dict[str, Any]] = []
              for scene_index in range(scene_count):
                  query_index = min(
                      len(terms) - 1,
                      math.floor(scene_index * len(terms) / scene_count),
                  )
                  start = scene_index * clip_duration
                  end = min(required_duration, start + clip_duration)
                  scene_plan.append(
                      {
                          "scene": scene_index + 1,
                          "query_index": query_index,
                          "query": terms[query_index],
                          "start": round(start, 3),
                          "end": round(end, 3),
                          "duration": round(end - start, 3),
                          "status": "pending",
                      }
                  )
              return scene_plan


          def _strict_scene_query_indexes(primary_index: int, query_count: int) -> list[int]:
              """Return the primary query followed by nearest chronological fallbacks."""
              order = [primary_index]
              for distance in range(1, query_count):
                  following = primary_index + distance
                  previous = primary_index - distance
                  if following < query_count:
                      order.append(following)
                  if previous >= 0:
                      order.append(previous)
              return order


          def _material_identity(item: MaterialInfo) -> str:
              """Prefer provider asset ids so alternate renditions still deduplicate."""
              source_info = item.source_info if isinstance(item.source_info, dict) else {}
              asset_id = source_info.get("asset_id")
              provider = str(item.provider or source_info.get("provider") or "unknown")
              if asset_id not in (None, ""):
                  return f"{provider}:asset:{asset_id}"
              return f"{provider}:url:{item.url}"


          def _download_videos_by_scene_queries(
              task_id: str,
              search_terms: List[str],
              search_videos,
              video_aspect: VideoAspect,
              audio_duration: float,
              max_clip_duration: int,
              material_directory: str,
          ) -> List[str]:
              """Assign one stock clip to every scene slot in narration order.

              Each scene first consumes an unused candidate from its own ordered query.
              If that query has no usable candidate, neighboring scene queries are tried
              as a graceful fallback. Reusing an already selected source is permitted
              only as a last resort so generation remains reliable when a provider has a
              very small result set.
              """
              terms = _normalize_scene_search_terms(search_terms)
              scene_plan = _build_strict_scene_plan(
                  search_terms=terms,
                  audio_duration=audio_duration,
                  max_clip_duration=max_clip_duration,
              )
              if not scene_plan:
                  logger.warning("strict scene matching could not build a scene plan")
                  return []

              task_artifacts.patch_script_data(task_id, scene_plan=scene_plan)
              logger.info(
                  "downloading videos with strict scene matching: "
                  f"scenes={len(scene_plan)}, queries={len(terms)}"
              )

              candidate_cache: dict[str, List[MaterialInfo]] = {}
              used_material_ids: set[str] = set()
              failed_material_ids: set[str] = set()
              video_paths: list[str] = []
              material_sources: list[dict[str, Any]] = []

              def candidates_for(query: str) -> List[MaterialInfo]:
                  if query not in candidate_cache:
                      items = search_videos(
                          search_term=query,
                          minimum_duration=max_clip_duration,
                          video_aspect=video_aspect,
                      )
                      candidate_cache[query] = list(items)
                      logger.info(
                          f"found {len(candidate_cache[query])} strict candidates "
                          f"for {query!r}"
                      )
                  return candidate_cache[query]

              def try_candidate(
                  item: MaterialInfo,
                  *,
                  allow_reuse: bool,
              ) -> tuple[str, bool] | None:
                  identity = _material_identity(item)
                  if identity in failed_material_ids:
                      return None
                  already_used = identity in used_material_ids
                  if already_used and not allow_reuse:
                      return None
                  try:
                      saved_path = save_video(
                          video_url=item.url,
                          save_dir=material_directory,
                      )
                  except Exception as exc:
                      failed_material_ids.add(identity)
                      logger.error(
                          "failed to download strict scene candidate: "
                          f"provider={item.provider}, "
                          f"error={type(exc).__name__}, "
                          f"detail={_redact_request_error(exc, item.url)}"
                      )
                      return None
                  if not saved_path:
                      failed_material_ids.add(identity)
                      return None
                  used_material_ids.add(identity)
                  return saved_path, already_used

              for scene in scene_plan:
                  primary_index = int(scene["query_index"])
                  query_indexes = _strict_scene_query_indexes(
                      primary_index,
                      len(terms),
                  )
                  selected = None
                  selected_item = None
                  selected_query = ""

                  for query_index in query_indexes:
                      query = terms[query_index]
                      for item in candidates_for(query):
                          result = try_candidate(item, allow_reuse=False)
                          if result is None:
                              continue
                          selected = result
                          selected_item = item
                          selected_query = query
                          break
                      if selected is not None:
                          break

                  if selected is None:
                      for query_index in query_indexes:
                          query = terms[query_index]
                          for item in candidates_for(query):
                              result = try_candidate(item, allow_reuse=True)
                              if result is None:
                                  continue
                              selected = result
                              selected_item = item
                              selected_query = query
                              break
                          if selected is not None:
                              break

                  if selected is None or selected_item is None:
                      scene["status"] = "unfilled"
                      logger.warning(
                          f"strict scene {scene['scene']} has no downloadable candidate"
                      )
                      continue

                  saved_path, reused = selected
                  video_paths.append(saved_path)
                  source_info = (
                      selected_item.source_info
                      if isinstance(selected_item.source_info, dict)
                      else {}
                  )
                  scene.update(
                      {
                          "status": "selected",
                          "selected_query": selected_query,
                          "provider": selected_item.provider,
                          "asset_id": source_info.get("asset_id"),
                          "local_file": Path(saved_path).name,
                          "reused": bool(reused),
                      }
                  )
                  if reused:
                      logger.warning(
                          "strict scene matching reused a source as last resort: "
                          f"scene={scene['scene']}, query={selected_query!r}"
                      )

                  try:
                      record = _material_source_record(selected_item, saved_path)
                      record["scene_index"] = scene["scene"]
                      record["scene_query"] = scene["query"]
                      record["selected_query"] = selected_query
                      record["reused"] = bool(reused)
                      material_sources.append(record)
                  except Exception as source_error:
                      logger.warning(
                          "failed to prepare strict scene source record: "
                          f"provider={selected_item.provider}, "
                          f"error={type(source_error).__name__}, "
                          f"detail={source_error}"
                      )

              task_artifacts.patch_script_data(task_id, scene_plan=scene_plan)
              _persist_material_sources(task_id, material_sources)
              logger.success(
                  "downloaded strict scene materials: "
                  f"selected={len(video_paths)}, scenes={len(scene_plan)}, "
                  f"unique_sources={len(used_material_ids)}"
              )
              return video_paths


          '''
          strict_helpers = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in strict_helpers.splitlines()
          ).lstrip("\n")
          replace_once(
              "app/services/material.py",
              "def _download_videos_by_script_order(\n",
              strict_helpers + "def _download_videos_by_script_order(\n",
          )

          replace_once(
              "app/services/material.py",
              "    if match_script_order:\n        return _download_videos_by_script_order(\n",
              "    if strict_scene_matching and source in {\"pexels\", \"pixabay\", \"coverr\"}:\n"
              "        return _download_videos_by_scene_queries(\n"
              "            task_id=task_id,\n"
              "            search_terms=search_terms,\n"
              "            search_videos=search_videos,\n"
              "            video_aspect=video_aspect,\n"
              "            audio_duration=audio_duration,\n"
              "            max_clip_duration=max_clip_duration,\n"
              "            material_directory=material_directory,\n"
              "        )\n\n"
              "    if match_script_order:\n"
              "        return _download_videos_by_script_order(\n",
          )

          replace_once(
              "app/services/task.py",
              "                video_concat_mode=(\n                    VideoConcatMode.sequential\n                    if params.match_materials_to_script\n                    else params.video_concat_mode\n                ),\n                audio_duration=audio_duration * params.video_count,\n                max_clip_duration=params.video_clip_duration,\n                match_script_order=params.match_materials_to_script,\n",
              "                video_concat_mode=(\n"
              "                    VideoConcatMode.sequential\n"
              "                    if (\n"
              "                        params.match_materials_to_script\n"
              "                        or params.strict_scene_matching\n"
              "                    )\n"
              "                    else params.video_concat_mode\n"
              "                ),\n"
              "                audio_duration=(\n"
              "                    audio_duration\n"
              "                    if params.strict_scene_matching\n"
              "                    else audio_duration * params.video_count\n"
              "                ),\n"
              "                max_clip_duration=params.video_clip_duration,\n"
              "                match_script_order=params.match_materials_to_script,\n"
              "                strict_scene_matching=params.strict_scene_matching,\n",
          )

          replace_once(
              "app/services/task.py",
              "    if params.match_materials_to_script:\n        video_concat_mode = VideoConcatMode.sequential\n",
              "    if params.match_materials_to_script or params.strict_scene_matching:\n"
              "        video_concat_mode = VideoConcatMode.sequential\n",
          )

          replace_once(
              "webui/Main.py",
              "        \"match_materials_to_script\": bool(\n            config.app.get(\"match_materials_to_script\", False)\n        ),\n",
              "        \"match_materials_to_script\": bool(\n"
              "            config.app.get(\"match_materials_to_script\", False)\n"
              "        ),\n"
              "        \"strict_scene_matching\": bool(\n"
              "            config.app.get(\"strict_scene_matching\", False)\n"
              "        ),\n",
          )

          replace_once(
              "webui/Main.py",
              "    st.session_state[\"match_materials_to_script\"] = bool(\n        params.get(\"match_materials_to_script\", False)\n    )\n",
              "    restored_strict_scene_matching = bool(\n"
              "        params.get(\"strict_scene_matching\", False)\n"
              "    )\n"
              "    st.session_state[\"strict_scene_matching\"] = restored_strict_scene_matching\n"
              "    st.session_state[\"match_materials_to_script\"] = bool(\n"
              "        params.get(\"match_materials_to_script\", False)\n"
              "        or restored_strict_scene_matching\n"
              "    )\n",
          )

          old_sync = '''def sync_script_order_concat_mode():
              """在文案顺序匹配开启时固定使用顺序拼接，并在关闭后恢复原选择。"""
              widget_key = localized_widget_key("video_concat_mode_select")
              previous_key = "video_concat_mode_before_script_order_match"
              match_script_order = bool(st.session_state.get("match_materials_to_script", False))

              if match_script_order:
                  current_mode = st.session_state.get(widget_key, VideoConcatMode.random.value)
                  if current_mode != VideoConcatMode.sequential.value:
                      st.session_state[previous_key] = current_mode
                  st.session_state[widget_key] = VideoConcatMode.sequential.value
                  return

              previous_mode = st.session_state.pop(previous_key, None)
              if previous_mode in {
                  VideoConcatMode.sequential.value,
                  VideoConcatMode.random.value,
              }:
                  st.session_state[widget_key] = previous_mode


          '''
          old_sync = "\n".join(
              line[14:] if line.startswith("              ") else line
              for line in old_sync.splitlines()
          ) + "\n"
          new_sync = '''def sync_script_order_concat_mode():
              """Force sequential composition while either ordered mode is enabled."""
              widget_key = localized_widget_key("video_concat_mode_select")
              previous_key = "video_concat_mode_before_script_order_match"
              match_script_order = bool(
                  st.session_state.get("match_materials_to_script", False)
              )
              strict_scene_matching = bool(
                  st.session_state.get("strict_scene_matching", False)
              )

              if match_script_order or strict_scene_matching:
                  current_mode = st.session_state.get(
                      widget_key, VideoConcatMode.random.value
                  )
                  if current_mode != VideoConcatMode.sequential.value:
                      st.session_state[previous_key] = current_mode
                  st.session_state[widget_key] = VideoConcatMode.sequential.value
                  return

              previous_mode = st.session_state.pop(previous_key, None)
              if previous_mode in {
                  VideoConcatMode.sequential.value,
                  VideoConcatMode.random.value,
              }:
                  st.session_state[widget_key] = previous_mode


          def sync_strict_scene_matching():
              """Strict matching implies ordered matching and restores prior state."""
              previous_key = "match_materials_before_strict_scene_matching"
              strict_enabled = bool(st.session_state.get("strict_scene_matching", False))
              if strict_enabled:
                  st.session_state.setdefault(
                      previous_key,
                      bool(st.session_state.get("match_materials_to_script", False)),
                  )
                  st.session_state["match_materials_to_script"] = True
              else:
                  previous_match = st.session_state.pop(previous_key, None)
                  if previous_match is not None:
                      st.session_state["match_materials_to_script"] = bool(previous_match)
              sync_script_order_concat_mode()


          '''
          new_sync = "\n".join(
              line[14:] if line.startswith("              ") else line
              for line in new_sync.splitlines()
          ) + "\n"
          replace_once("webui/Main.py", old_sync, new_sync)

          replace_once(
              "webui/Main.py",
              "                disabled=bool(st.session_state.get(\"match_materials_to_script\", False)),\n",
              "                disabled=bool(\n"
              "                    st.session_state.get(\"match_materials_to_script\", False)\n"
              "                    or st.session_state.get(\"strict_scene_matching\", False)\n"
              "                ),\n",
          )

          old_match_block = '''            params.match_materials_to_script = st.checkbox(
              tr("Match Materials to Script Order"),
              help=tr("Match Materials to Script Order Help"),
              key="match_materials_to_script",
              on_change=sync_script_order_concat_mode,
          )
          _set_runtime_config(
              "app",
              "match_materials_to_script",
              params.match_materials_to_script,
          )
          # 顺序匹配开启时，sequential 是派生出的强制值，不应覆盖用户在关闭
          # 该功能时选择的拼接偏好；关闭后仍能恢复此前的 random/sequential。
          if not params.match_materials_to_script:
              _set_runtime_config(
                  "ui", "video_concat_mode", params.video_concat_mode.value
              )
          '''
          new_match_block = '''            strict_scene_supported = params.video_source in VIDEO_SOURCE_GROUPS["stock_video"]
          if (
              not strict_scene_supported
              and st.session_state.get("strict_scene_matching", False)
          ):
              st.session_state["strict_scene_matching"] = False
              sync_strict_scene_matching()

          params.match_materials_to_script = st.checkbox(
              tr("Match Materials to Script Order"),
              help=tr("Match Materials to Script Order Help"),
              key="match_materials_to_script",
              on_change=sync_script_order_concat_mode,
              disabled=bool(st.session_state.get("strict_scene_matching", False)),
          )
          params.strict_scene_matching = st.checkbox(
              tr("Strict Scene Matching"),
              help=tr("Strict Scene Matching Help"),
              key="strict_scene_matching",
              on_change=sync_strict_scene_matching,
              disabled=not strict_scene_supported,
          )
          if params.strict_scene_matching:
              params.match_materials_to_script = True

          _set_runtime_config(
              "app",
              "match_materials_to_script",
              params.match_materials_to_script,
          )
          _set_runtime_config(
              "app",
              "strict_scene_matching",
              params.strict_scene_matching,
          )
          # Ordered modes derive sequential composition and must not overwrite the
          # user's normal random/sequential preference while they are active.
          if not (
              params.match_materials_to_script or params.strict_scene_matching
          ):
              _set_runtime_config(
                  "ui", "video_concat_mode", params.video_concat_mode.value
              )
          '''
          replace_once("webui/Main.py", old_match_block, new_match_block)

          replace_once(
              "webui/Main.py",
              "    params = VideoParams(video_subject=\"\")\n    params.match_materials_to_script = bool(\n        st.session_state.get(\"match_materials_to_script\", False)\n    )\n",
              "    params = VideoParams(video_subject=\"\")\n"
              "    params.strict_scene_matching = bool(\n"
              "        st.session_state.get(\"strict_scene_matching\", False)\n"
              "    )\n"
              "    params.match_materials_to_script = bool(\n"
              "        st.session_state.get(\"match_materials_to_script\", False)\n"
              "        or params.strict_scene_matching\n"
              "    )\n",
          )

          replace_once(
              "config.example.toml",
              "video_source = \"pexels\"\n\n# API key lists support key rotation.\n",
              "video_source = \"pexels\"\n\n"
              "# Opt-in stock-footage scene assignment. When true, ordered search terms\n"
              "# are treated as scene queries and one clip is selected per timeline slot.\n"
              "# Pexels, Pixabay and Coverr are supported. The default preserves upstream\n"
              "# material selection behavior.\n"
              "strict_scene_matching = false\n\n"
              "# API key lists support key rotation.\n",
          )

          replace_once(
              "webui/i18n/en.json",
              '    "Match Materials to Script Order Help": "Generate keywords and match materials in script order so visuals follow the current voiceover.",\n',
              '    "Match Materials to Script Order Help": "Generate keywords and match materials in script order so visuals follow the current voiceover.",\n'
              '    "Strict Scene Matching": "Strict Scene Matching",\n'
              '    "Strict Scene Matching Help": "Treat ordered stock-video keywords as scene queries, assign one clip per timeline scene, avoid duplicate sources when possible, and preserve narrative order. Available for Pexels, Pixabay, and Coverr.",\n',
          )

          replace_once(
              "webui/i18n/es.json",
              '    "Match Materials to Script Order Help": "Genera términos y ordena el material según el guion para que las imágenes sigan la narración.",\n',
              '    "Match Materials to Script Order Help": "Genera términos y ordena el material según el guion para que las imágenes sigan la narración.",\n'
              '    "Strict Scene Matching": "Coincidencia estricta por escenas",\n'
              '    "Strict Scene Matching Help": "Trata las palabras clave ordenadas como búsquedas de escena, asigna un clip por escena de la línea de tiempo, evita fuentes duplicadas cuando sea posible y conserva el orden narrativo. Disponible para Pexels, Pixabay y Coverr.",\n',
          )

          test_file = Path("test/services/test_strict_scene_matching.py")
          test_file.write_text(
              '''from pathlib import Path
          from unittest.mock import patch

          from app.models.schema import MaterialInfo, VideoParams
          from app.services import material


          def _item(url: str, asset_id: str, search_term: str) -> MaterialInfo:
              item = MaterialInfo(
                  provider="pexels",
                  url=url,
                  duration=9,
                  source_info={
                      "provider": "pexels",
                      "asset_id": asset_id,
                      "search_term": search_term,
                  },
              )
              return item


          def test_strict_scene_matching_defaults_off():
              params = VideoParams(video_subject="test")
              assert params.strict_scene_matching is False


          def test_scene_plan_repeats_queries_only_in_contiguous_slots():
              plan = material._build_strict_scene_plan(
                  ["first action", "second action"],
                  audio_duration=7,
                  max_clip_duration=3,
              )

              assert [scene["query"] for scene in plan] == [
                  "first action",
                  "first action",
                  "second action",
              ]
              assert [(scene["start"], scene["end"]) for scene in plan] == [
                  (0, 3),
                  (3, 6),
                  (6, 7.0),
              ]


          def test_strict_downloader_avoids_duplicate_asset_when_alternative_exists():
              shared = _item("https://example.test/shared.mp4", "shared", "one")
              unique = _item("https://example.test/unique.mp4", "unique", "two")

              def search_videos(search_term, minimum_duration, video_aspect):
                  del minimum_duration, video_aspect
                  if search_term == "one":
                      return [shared]
                  return [shared, unique]

              with (
                  patch(
                      "app.services.material.save_video",
                      side_effect=lambda video_url, save_dir: str(
                          Path(save_dir or "/tmp") / Path(video_url).name
                      ),
                  ),
                  patch(
                      "app.services.material.task_artifacts.patch_script_data",
                      return_value=True,
                  ),
              ):
                  paths = material._download_videos_by_scene_queries(
                      task_id="strict-test",
                      search_terms=["one", "two"],
                      search_videos=search_videos,
                      video_aspect=material.VideoAspect.portrait,
                      audio_duration=6,
                      max_clip_duration=3,
                      material_directory="/tmp",
                  )

              assert [Path(path).name for path in paths] == [
                  "shared.mp4",
                  "unique.mp4",
              ]


          def test_strict_downloader_reuses_only_as_last_resort():
              shared = _item("https://example.test/shared.mp4", "shared", "one")
              saved_plans = []

              def search_videos(search_term, minimum_duration, video_aspect):
                  del search_term, minimum_duration, video_aspect
                  return [shared]

              def capture_plan(task_id, **updates):
                  del task_id
                  if "scene_plan" in updates:
                      saved_plans.append([dict(scene) for scene in updates["scene_plan"]])
                  return True

              with (
                  patch(
                      "app.services.material.save_video",
                      return_value="/tmp/shared.mp4",
                  ),
                  patch(
                      "app.services.material.task_artifacts.patch_script_data",
                      side_effect=capture_plan,
                  ),
              ):
                  paths = material._download_videos_by_scene_queries(
                      task_id="strict-test",
                      search_terms=["one", "two"],
                      search_videos=search_videos,
                      video_aspect=material.VideoAspect.portrait,
                      audio_duration=6,
                      max_clip_duration=3,
                      material_directory="/tmp",
                  )

              assert paths == ["/tmp/shared.mp4", "/tmp/shared.mp4"]
              assert saved_plans[-1][0]["reused"] is False
              assert saved_plans[-1][1]["reused"] is True


          def test_existing_ordered_path_is_unchanged_when_strict_is_off():
              with patch(
                  "app.services.material._download_videos_by_script_order",
                  return_value=["ordered.mp4"],
              ) as ordered:
                  result = material.download_videos(
                      task_id="ordered-test",
                      search_terms=["one"],
                      source="pexels",
                      audio_duration=3,
                      max_clip_duration=3,
                      match_script_order=True,
                      strict_scene_matching=False,
                  )

              assert result == ["ordered.mp4"]
              ordered.assert_called_once()


          def test_strict_stock_path_is_opt_in():
              with patch(
                  "app.services.material._download_videos_by_scene_queries",
                  return_value=["strict.mp4"],
              ) as strict:
                  result = material.download_videos(
                      task_id="strict-test",
                      search_terms=["one"],
                      source="pexels",
                      audio_duration=3,
                      max_clip_duration=3,
                      match_script_order=False,
                      strict_scene_matching=True,
                  )

              assert result == ["strict.mp4"]
              strict.assert_called_once()
          '''.replace("          ", ""),
              encoding="utf-8",
          )

