name: Verify Manual GPT Review Retry Cap

on:
  push:
    branches:
      - feature/manual-gpt-review-retry-cap
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Apply retry cap patch
        run: python .github/scripts/apply_manual_gpt_review_retry_cap.py

      - name: Inspect patch integrity
        run: |
          git diff --check
          grep -q "MAX_RETRY_ROUNDS = 3" app/services/gpt_visual_review.py
          grep -q "retry_exhausted" app/services/gpt_visual_review.py
          grep -q "Retry scenes only" webui/pages/GPT_Visual_Review.py
          git diff -- app/services/gpt_visual_review.py webui/pages/GPT_Visual_Review.py

      - name: Install locked dependencies
        run: uv sync --frozen --python 3.11

      - name: Compile changed sources
        run: >-
          uv run --no-sync python -m compileall -q
          app/services/gpt_visual_review.py
          webui/pages/GPT_Visual_Review.py
          test/services/test_gpt_visual_review_retry_cap.py

      - name: Ruff changed sources
        run: >-
          uv run --no-sync ruff check
          app/services/gpt_visual_review.py
          webui/pages/GPT_Visual_Review.py
          test/services/test_gpt_visual_review_retry_cap.py

      - name: Run focused review tests
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          test/services/test_gpt_visual_review.py
          test/services/test_gpt_visual_review_retry_cap.py
          test/services/test_semantic_scene_ranking.py
          test/services/test_strict_scene_matching.py

      - name: Run full test suite
        run: uv run --no-sync python -X utf8 -m pytest -q test

      - name: Commit verified retry cap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/services/gpt_visual_review.py \
            webui/pages/GPT_Visual_Review.py \
            test/services/test_gpt_visual_review_retry_cap.py
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "fix: bound manual GPT visual review retries"
          git push origin HEAD:feature/manual-gpt-review-retry-cap
