name: Verify Semantic Negative Diversity

on:
  push:
    branches:
      - feature/semantic-negative-diversity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked main-app dependencies
        run: uv sync --frozen --python 3.11

      - name: Check diff whitespace
        run: git diff --check origin/feature/semantic-scene-ranking...HEAD

      - name: Compile changed Python sources
        run: >-
          uv run --no-sync python -m compileall
          app/services/semantic_ranker.py
          app/services/strict_scene.py
          semantic_ranker/main.py
          test/services/test_semantic_scene_ranking.py

      - name: Ruff changed Python sources
        run: >-
          uv run --no-sync ruff check
          app/services/semantic_ranker.py
          app/services/strict_scene.py
          semantic_ranker/main.py
          test/services/test_semantic_scene_ranking.py

      - name: Run focused regression tests
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          test/services/test_semantic_scene_ranking.py
          test/services/test_strict_scene_matching.py
          test/services/test_material.py
          test/services/test_task.py

      - name: Run full test suite
        run: uv run --no-sync python -X utf8 -m pytest -q test
