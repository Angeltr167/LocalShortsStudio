name: Verify Semantic Scene Bridges

on:
  push:
    branches:
      - feature/semantic-scene-bridges
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/semantic-scene-bridges
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Apply semantic scene bridge patch
        run: python .github/scripts/apply_semantic_scene_bridge_patch.py

      - name: Inspect patch integrity
        run: |
          git diff --check
          git diff --stat

      - name: Install locked dependencies
        run: uv sync --frozen --python 3.11

      - name: Compile changed sources
        run: >-
          uv run --no-sync python -m compileall
          app/services/strict_scene.py
          app/services/semantic_ranker.py
          test/services/test_strict_scene_matching.py
          test/services/test_semantic_scene_ranking.py

      - name: Ruff changed sources
        run: >-
          uv run --no-sync ruff check
          app/services/strict_scene.py
          app/services/semantic_ranker.py
          test/services/test_strict_scene_matching.py
          test/services/test_semantic_scene_ranking.py

      - name: Run focused regression tests
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          test/services/test_semantic_scene_ranking.py
          test/services/test_strict_scene_matching.py
          test/services/test_material_cache.py
          test/services/test_material.py
          test/services/test_task.py

      - name: Run full test suite
        run: uv run --no-sync python -X utf8 -m pytest -q test

      - name: Commit verified bridge implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/strict_scene.py app/services/semantic_ranker.py \
            test/services/test_strict_scene_matching.py \
            test/services/test_semantic_scene_ranking.py
          git commit -m "feat: add semantic transition bridges"
          git push origin HEAD:feature/semantic-scene-bridges
